<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Llegué</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
  <div class="admin-topbar">Llegué — Portal de administración</div>

  <div class="admin-card">
    <h2>Iniciar sesión</h2>

    <div id="error-box" class="admin-error" style="display:none;"></div>

    <form id="login-form">
      <div class="admin-field">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="admin-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="admin-btn" id="submit-btn">Iniciar sesión</button>
    </form>
  </div>

  <script src="session.js"></script>
  <script src="login.js"></script>
</body>
</html>
