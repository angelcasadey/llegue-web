<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Llegué</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
  <div class="admin-topbar">
    <span>Llegué — Portal de administración</span>
    <a href="/" class="admin-back-link">← Volver al sitio</a>
  </div>

  <div class="admin-card">
    <h2>Iniciar sesión</h2>

    <div id="error-box" class="admin-error" style="display:none;"></div>

    <form id="login-form">
      <div class="admin-field">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="admin-field">
        <label for="password">Contraseña</label>
        <div class="admin-password">
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="admin-password-toggle" id="password-toggle" aria-controls="password" aria-pressed="false" aria-label="Mostrar contraseña" title="Mostrar contraseña">
            <svg class="icon-show" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-hide" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="admin-btn" id="submit-btn">Iniciar sesión</button>
    </form>
  </div>

  <script src="session.js"></script>
  <script src="login.js"></script>
</body>
</html>
